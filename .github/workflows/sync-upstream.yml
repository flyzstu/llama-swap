name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'flyzstu/llama-swap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          ref: main

      - name: Update sync branch
        id: sync
        env:
          SYNC_BRANCH: automation/sync-upstream
        run: |
          git remote add upstream https://github.com/mostlygeek/llama-swap.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push --force origin "upstream/main:refs/heads/${SYNC_BRANCH}"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN || github.token }}
          SYNC_BRANCH: automation/sync-upstream
        run: |
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [[ -n "$pr_number" ]]; then
            echo "Updated existing pull request #${pr_number}."
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "ci: sync upstream main" \
            --body "Sync \`mostlygeek/llama-swap:main\` into this fork for manual review."
